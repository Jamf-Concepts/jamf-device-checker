name: Bug Report
description: Report a bug or unexpected behavior in [APP NAME]
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much detail as possible to help us reproduce and fix it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open the app
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - iPadOS
        - macOS
        - visionOS
        - Other
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS Version
      placeholder: "e.g. iOS 17.4"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version
      placeholder: "e.g. 1.2.0 — found in Settings > About"
    validations:
      required: true

  - type: dropdown
    id: mdm
    attributes:
      label: Device managed by MDM?
      options:
        - "Yes — Jamf Pro"
        - "Yes — other MDM"
        - "No — unmanaged"
        - Not sure
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Additional Context / Logs
      description: Screenshots, console logs, or any other relevant information.
    validations:
      required: false
